<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c212d" />
      <stop offset="50%" stop-color="#12161f" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b475e" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>

    <linearGradient id="limeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eeff82" />
      <stop offset="50%" stop-color="#d4ff3f" />
      <stop offset="100%" stop-color="#8be604" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4ff3f" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d4ff3f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Squircle Badge -->
  <rect x="24" y="24" width="452" height="452" rx="96" fill="url(#logoBg)" stroke="url(#logoBorder)" stroke-width="4" />
  
  <!-- Subtle Backlight -->
  <circle cx="250" cy="210" r="160" fill="url(#centerGlow)" />

  <!-- Lens & Aperture Group -->
  <g transform="translate(250, 210)">
    <circle cx="0" cy="0" r="115" fill="none" stroke="#252c38" stroke-width="6" />
    <circle cx="0" cy="0" r="108" fill="#0d1017" stroke="url(#limeAccent)" stroke-width="3.5" stroke-dasharray="10 5" opacity="0.85" />

    <!-- 6 Aperture Blades -->
    <path d="M 0,-104 A 104,104 0 0,1 90,-52 L 35,-13 L 0,-42 Z" fill="#151a24" stroke="#d4ff3f" stroke-width="2.2" />
    <path d="M 90,-52 A 104,104 0 0,1 90,52 L 29,26 L 35,-13 Z" fill="#181e29" stroke="#d4ff3f" stroke-width="2.2" />
    <path d="M 90,52 A 104,104 0 0,1 0,104 L -6,38 L 29,26 Z" fill="#151a24" stroke="#d4ff3f" stroke-width="2.2" />
    <path d="M 0,104 A 104,104 0 0,1 -90,52 L -35,13 L -6,38 Z" fill="#181e29" stroke="#d4ff3f" stroke-width="2.2" />
    <path d="M -90,52 A 104,104 0 0,1 -90,-52 L -29,-26 L -35,13 Z" fill="#151a24" stroke="#d4ff3f" stroke-width="2.2" />
    <path d="M -90,-52 A 104,104 0 0,1 0,-104 L 6,-38 L -29,-26 Z" fill="#181e29" stroke="#d4ff3f" stroke-width="2.2" />

    <!-- Central Disc -->
    <circle cx="0" cy="0" r="50" fill="#0d1118" stroke="url(#limeAccent)" stroke-width="3.5" />
    
    <!-- Monogram LS -->
    <path d="M -30 -26 L -30 26 L -8 26" fill="none" stroke="#d4ff3f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 28 -18 C 28 -25 20 -26 12 -26 C 2 -26 -2 -20 -2 -12 C -2 -1 13 2 22 5 C 32 8 35 14 35 21 C 35 30 26 35 13 35 C 3 35 -4 30 -5 22" fill="none" stroke="#ffffff" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Brackets < > -->
    <path d="M -130 -42 L -166 0 L -130 42" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 130 -42 L 166 0 L 130 42" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="250" y="405" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="10" fill="#ffffff" text-anchor="middle">LAKSHYA SHAH</text>
  <text x="250" y="432" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="5" fill="#d4ff3f" text-anchor="middle">CREATIVE DEV &amp; PHOTO</text>
</svg>
