<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <style>
      .cam-line { fill: none; stroke: #111111; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
      .bracket { fill: none; stroke: #9ee616; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
      .shutter-blade { fill: #1c1c1c; stroke: #ffffff; stroke-width: 2.2; }
      .shutter-center { fill: #9ee616; }
      .brand-txt { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 12px; fill: #111111; }
    </style>
  </defs>

  <!-- Top Camera Body Arch & Shoulders -->
  <path class="cam-line" d="M 120 180 L 120 155 C 120 142 130 132 142 132 L 180 132 L 206 106 L 294 106 L 320 132 L 358 132 C 370 132 380 142 380 155 L 380 180" />

  <!-- Bottom Camera Body Frame -->
  <path class="cam-line" d="M 380 230 L 380 255 C 380 268 370 278 358 278 L 142 278 C 130 278 120 268 120 255 L 120 230" />

  <!-- Code Bracket Left < -->
  <path class="bracket" d="M 152 178 L 118 205 L 152 232" />

  <!-- Code Bracket Right > -->
  <path class="bracket" d="M 348 178 L 382 205 L 348 232" />

  <!-- Center Aperture Lens (Outer Circle) -->
  <circle cx="250" cy="205" r="54" fill="#181818" />

  <!-- Aperture Blades (6 Blades) -->
  <g id="apertureGroup" transform="translate(250, 205)">
    <path class="shutter-blade" d="M 0,-54 A 54,54 0 0,1 46.7,-27 L 18,-6 L 0,-21 Z" />
    <path class="shutter-blade" d="M 46.7,-27 A 54,54 0 0,1 46.7,27 L 14,14 L 18,-6 Z" />
    <path class="shutter-blade" d="M 46.7,27 A 54,54 0 0,1 0,54 L -4,20 L 14,14 Z" />
    <path class="shutter-blade" d="M 0,54 A 54,54 0 0,1 -46.7,27 L -18,6 L -4,20 Z" />
    <path class="shutter-blade" d="M -46.7,27 A 54,54 0 0,1 -46.7,-27 L -14,-14 L -18,6 Z" />
    <path class="shutter-blade" d="M -46.7,-27 A 54,54 0 0,1 0,-54 L 4,-20 L -14,-14 Z" />

    <!-- Center Lime Hexagon Iris -->
    <polygon class="shutter-center" points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" />
  </g>

  <!-- Typography: LAKSHYA SHAH -->
  <text class="brand-txt" x="256" y="365" text-anchor="middle">LAKSHYA SHAH</text>
</svg>
